name: EcoPaste Edit Save UI Windows Validation

"on":
  push:
    branches:
      - validation/2026-10-12-edit-save-ui

permissions:
  contents: read

concurrency:
  group: ecopaste-edit-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64 Edited Content
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest
      - name: Format edited frontend files
        run: >-
          pnpm exec biome check --write
          src/types/clipboard.ts
          src/constants/commands.ts
          src/constants/events.ts
          src/commands/index.ts
          src/pages/Clipboard/index.tsx
          src/pages/Clipboard/components/List.tsx
          src/pages/Clipboard/components/EditContentModal.tsx
          src/pages/PinnedPanel/index.tsx
          src/locales/zh-CN/clipboard.json
          src/locales/en-US/clipboard.json
          src/locales/zh-CN/commands.json
          src/locales/en-US/commands.json
      - name: Format Rust source
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Upload formatted source for exact Git sync
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-EditSaveUI-FormattedSource
          path: |
            src/types/clipboard.ts
            src/constants/commands.ts
            src/constants/events.ts
            src/commands/index.ts
            src/pages/Clipboard/index.tsx
            src/pages/Clipboard/components/List.tsx
            src/pages/Clipboard/components/EditContentModal.tsx
            src/pages/PinnedPanel/index.tsx
            src/locales/zh-CN/clipboard.json
            src/locales/en-US/clipboard.json
            src/locales/zh-CN/commands.json
            src/locales/en-US/commands.json
            src-tauri/src/clipboard/write.rs
            src-tauri/src/clipboard/mod.rs
            src-tauri/src/commands/clipboard.rs
            src-tauri/src/lib.rs
            src-tauri/src/db/models.rs
            src-tauri/src/menu/clipboard_item.rs
            src-tauri/src/i18n/keys.rs
            src-tauri/src/i18n/zh_cn/clipboard_menu.rs
            src-tauri/src/i18n/en_us/clipboard_menu.rs
          if-no-files-found: error
      - name: Frontend lint and types
        run: pnpm lint && pnpm tsc
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build frontend
        run: pnpm build
      - name: Build Windows EXE
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-Windows-x64-EditSaveUI
          path: src-tauri/target/x86_64-pc-windows-msvc/release/EcoPaste.exe
          if-no-files-found: error
