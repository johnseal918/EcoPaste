name: One-time remote fit rustfmt

"on":
  push:
    paths:
      - .github/workflows/remote-fit-format-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Format modified Rust files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clipboard-priority-pin-panel
      - name: Setup rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit only remote-fit Rust formatting
        shell: bash
        run: |
          git add -- src-tauri/src/window/state.rs src-tauri/src/window/position.rs src-tauri/src/window/mod.rs src-tauri/src/lib.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Rust formatting already clean"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: apply rustfmt to remote desktop workarea fix"
            git push origin HEAD:feature/clipboard-priority-pin-panel
          fi
