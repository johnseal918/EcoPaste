name: EcoPaste Side Panel Hover Preview Validation

"on":
  push:
    branches:
      - feature/clipboard-priority-pin-panel

permissions:
  contents: read

concurrency:
  group: side-hover-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest
      - name: Format changed TS source
        run: >-
          pnpm exec biome check --write
          src/commands/index.ts
          src/pages/Clipboard/hooks/useClipboardPreviewController.ts
          src/pages/Clipboard/hooks/previewController.ts
          src/pages/PinnedPanel/index.tsx
      - name: Format Rust source
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-SidePreview-FormattedSource
          path: |
            src/commands/index.ts
            src/pages/Clipboard/hooks/useClipboardPreviewController.ts
            src/pages/Clipboard/hooks/previewController.ts
            src/pages/PinnedPanel/index.tsx
            src-tauri/src/window/preview.rs
            src-tauri/src/commands/window.rs
          if-no-files-found: error
      - name: Frontend lint and types
        run: pnpm lint && pnpm tsc
      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build frontend
        run: pnpm build
      - name: Build Windows EXE
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-Windows-x64-SidePanel-HoverPreview
          path: src-tauri/target/x86_64-pc-windows-msvc/release/EcoPaste.exe
          if-no-files-found: error
