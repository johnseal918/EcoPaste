name: One-Time Clipboard Geometry Rustfmt

"on":
  push:
    paths:
      - .github/workflows/geometry-rustfmt-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Format only window geometry Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/clipboard-priority-pin-panel
      - name: Rustfmt toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Run official Rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit formatted window source
        shell: bash
        run: |
          git add -- src-tauri/src/window/state.rs src-tauri/src/window/position.rs src-tauri/src/window/mod.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Window Rust sources already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format consolidated EcoPaste window sources"
            git push origin HEAD:feature/clipboard-priority-pin-panel
          fi
