name: Windows Cross-App Image Paste Validation

"on":
  push:
    branches:
      - feature/clipboard-priority-pin-panel

permissions:
  contents: read

concurrency:
  group: ecopaste-image-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Build frontend
        run: pnpm build
      - name: Build Windows executable
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-Windows-x64-ImagePaste-Interop-Fix
          path: src-tauri/target/x86_64-pc-windows-msvc/release/EcoPaste.exe
          if-no-files-found: error
      - name: Test image format payloads - best effort on Windows CI
        working-directory: src-tauri
        continue-on-error: true
        timeout-minutes: 4
        run: cargo test image_formats_preserve_png_dib24_and_dibv5_headers
