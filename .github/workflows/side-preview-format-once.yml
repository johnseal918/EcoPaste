name: One-time Side Preview Source Formatting

"on":
  push:
    paths:
      - .github/workflows/side-preview-format-once.yml

permissions:
  contents: write

jobs:
  format:
    name: Converge formatting with built EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout draft feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clipboard-priority-pin-panel
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply same Biome formatting as EXE build
        run: >-
          pnpm exec biome check --write
          src/commands/index.ts
          src/pages/Clipboard/hooks/useClipboardPreviewController.ts
          src/pages/Clipboard/hooks/previewController.ts
          src/pages/PinnedPanel/index.tsx
      - name: Setup rustfmt
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - name: Apply same rustfmt as EXE build
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Commit only side-panel preview source formatting
        shell: bash
        run: |
          git add -- src/commands/index.ts src/pages/Clipboard/hooks/useClipboardPreviewController.ts src/pages/Clipboard/hooks/previewController.ts src/pages/PinnedPanel/index.tsx src-tauri/src/window/preview.rs src-tauri/src/commands/window.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "All touched source files were already formatted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c core.hooksPath=/dev/null commit -m "chore: format side-panel hover preview source"
            git push origin HEAD:feature/clipboard-priority-pin-panel
          fi
