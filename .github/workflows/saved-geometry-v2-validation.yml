name: Windows Saved Geometry v2 Migration

"on":
  push:
    branches:
      - feature/clipboard-priority-pin-panel

permissions:
  contents: read

concurrency:
  group: ecopaste-saved-geometry-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        run: pnpm build:icon
        env:
          PLATFORM: windows-latest
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Upload formatted window source
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-SizingV2-FormattedSource
          path: src-tauri/src/window/state.rs
          if-no-files-found: error
      - name: Verify Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build frontend
        run: pnpm build
      - name: Build Windows EXE
        run: pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: EcoPaste-Windows-x64-OriginalWidth-CompactHeight-V2
          path: src-tauri/target/x86_64-pc-windows-msvc/release/EcoPaste.exe
          if-no-files-found: error
